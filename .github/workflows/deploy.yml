name: CI/CD - Build, Push and Deploy

on:
  push:
    branches: [rodrigo-baeza]

jobs:
  build-and-push:
    name: Build and Push to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sanosysalvos-reporte-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH (proxy a través del front)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # EC2 back (subred privada, IP privada)
          host: ${{ secrets.EC2_BACK_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PEM_KEY }}
          # EC2 front como bastion (subred pública, IP pública)
          proxy_host: ${{ secrets.EC2_FRONT_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_PEM_KEY }}
          script: |
            # Instalar Docker si no está presente
            if ! command -v docker &> /dev/null; then
              sudo dnf update -y -q
              sudo dnf install -y -q docker
              sudo systemctl enable --now docker
              sudo usermod -aG docker ec2-user
              COMPOSE_VERSION=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              sudo systemctl restart docker
            fi

            # Crear directorio infra si no existe
            sudo mkdir -p /opt/sanosysalvos/infra
            sudo chown ec2-user:ec2-user /opt/sanosysalvos/infra

            cd /opt/sanosysalvos/infra

            # Verificar que existan docker-compose.yml y .env antes de continuar
            if [ ! -f docker-compose.yml ] || [ ! -f .env ]; then
              echo "ERROR: Faltan docker-compose.yml o .env en /opt/sanosysalvos/infra"
              echo "Copia esos archivos al EC2 antes de continuar."
              exit 1
            fi

            docker compose pull report-service
            docker compose up -d --no-deps report-service
            docker image prune -f
